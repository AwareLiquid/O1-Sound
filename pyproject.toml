[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o1sound"
version = "0.1.0"
description = "Multilingual greeting wake-word spotter on the O-Series liquid core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
export = ["onnx>=1.16", "onnxruntime>=1.17"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["o1sound*"]
